<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!--TITLE--></title>
<meta name="description" content="<!--DESC-->">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230e0906'/%3E%3Cpath d='M50 22 L82 78 L18 78 Z' fill='none' stroke='%23e8c88a' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="ink-canvas" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<div id="progress-rail" aria-hidden="true"><div id="progress-fill"></div></div>

<!-- No #lang-switch here on purpose: this bonus text exists in Russian
     only, so the language bootstrap/switcher the treatise pages carry
     has nothing to do here. Same top-left spot as the "✦ Бонус" link on
     the treatise, so the way back is exactly where the way in was. -->
<a id="back-link" class="corner-link" href="index.html">△ Трактат</a>

<button id="mobile-menu-btn" aria-label="Меню" aria-expanded="false" aria-controls="mobile-sheet">
  <svg viewBox="0 0 24 24" width="18" height="18">
    <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
</button>
<div id="mobile-sheet-backdrop"></div>

<div id="mobile-sheet" role="dialog" aria-label="Меню">
  <div id="mobile-sheet-handle" aria-hidden="true"></div>

  <nav id="side-nav" aria-label="Главы рассказа">
    <!--NAV-->
  </nav>

  <div id="controls-row">
    <button id="sound-toggle" aria-label="Переключить фоновый звук" title="Звук">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 10v4h4l5 5V5L7 10H3z" fill="currentColor"/></svg>
    </button>

    <div id="tts-wrap">
      <button id="tts-toggle" aria-label="Слушать рассказ вслух" title="Слушать">
        <svg class="tts-icon-play" viewBox="0 0 24 24" width="16" height="16"><path d="M6 4l14 8-14 8V4z" fill="currentColor"/></svg>
        <svg class="tts-icon-pause" viewBox="0 0 24 24" width="16" height="16"><path d="M5 4h4v16H5V4zm10 0h4v16h-4V4z" fill="currentColor"/></svg>
      </button>
      <button id="tts-voice-btn" aria-label="Выбрать голос чтеца" title="Голос" aria-haspopup="true" aria-expanded="false" hidden>
        <svg viewBox="0 0 24 24" width="9" height="9"><path d="M4 3l9 9-9 9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="tts-voice-panel" role="menu" aria-label="Голос" hidden></div>
    </div>

    <a id="pdf-download" href="bird.pdf" download aria-label="Скачать PDF" title="Скачать PDF">
      <svg viewBox="0 0 24 24" width="16" height="16">
        <path d="M12 3a1 1 0 0 1 1 1v8.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42l2.3 2.3V4a1 1 0 0 1 1-1z" fill="currentColor"/>
        <path d="M5 19a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H6a1 1 0 0 1-1-1z" fill="currentColor"/>
      </svg>
    </a>

    <div id="text-size-controls">
      <button id="text-size-dec" aria-label="Уменьшить размер текста" title="Меньше текста">A</button>
      <button id="text-size-inc" aria-label="Увеличить размер текста" title="Больше текста">A</button>
    </div>
  </div>
</div>

<main id="scroll-container">

  <header class="hero" data-mood="flow">
    <div class="hero-inner">
      <span class="hero-glyph">△</span>
      <h1 class="hero-title"><!--HERO_TITLE--></h1>
      <p class="hero-subtitle"><!--HERO_SUBTITLE--></p>
      <div class="scroll-cue">
        <span>прокрутите, чтобы начать</span>
        <span class="scroll-cue-line"></span>
      </div>
    </div>
  </header>

  <!--CHAPTERS-->

  <footer class="site-footer">
    <span class="glyph-line" aria-hidden="true">△</span>
    <p><!--FOOTER--></p>
    <p class="footer-updated"><!--UPDATED--></p>
    <p class="footer-bonus"><a href="index.html">△ Вернуться к трактату</a></p>
  </footer>

</main>

<!-- p5.js — ink / flow-field background -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<!-- GSAP + ScrollTrigger -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<!-- Lenis smooth scroll -->
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>

<script src="js/ink.js"></script>
<script src="js/main.js"></script>
</body>
</html>
